
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyTheme - 나만의 꾸미기</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;padding:20px;
  font-family:system-ui,sans-serif;
  background:#15151e;color:#fff;
}
h1{font-size:25px}
h2{font-size:17px}
.panel{
  background:#242431;padding:16px;
  border-radius:18px;margin:14px 0;
}
label{display:block;margin:13px 0 6px}
input,select,button{
  font:inherit;border:0;border-radius:10px;
  padding:11px;max-width:100%;
}
input[type=text],select{
  width:100%;background:#383849;color:white;
}
input[type=color]{width:100%;height:45px}
button{
  background:#c6b4ff;color:#171421;
  font-weight:700;margin-top:10px;width:100%;
}
#screen{
  min-height:390px;border-radius:25px;
  padding:25px 15px;
  background:linear-gradient(145deg,#b5a2e8,#f3cbd9);
  background-size:cover;background-position:center;
  color:white;text-align:center;
}
#clock{font-size:43px;font-weight:300}
#date{font-size:14px;margin-bottom:35px}
#icons{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:22px 8px;margin-top:25px;
}
.app{font-size:12px;overflow-wrap:anywhere}
.app img{
  width:62px;height:62px;object-fit:cover;
  display:block;margin:0 auto 7px;
  background:#ffffff55;
}
.circle{border-radius:50%}
.round{border-radius:19px}
.square{border-radius:3px}
#status{font-size:13px;color:#d9d2f5}
</style>
</head>
<body>
<h1>✦ MyTheme</h1>
<p>나만의 홈 화면 디자인 스튜디오</p>

<div class="panel">
<h2>미리 보기</h2>
<div id="screen">
  <div id="clock">12:00</div>
  <div id="date"></div>
  <div id="widget">✦ 나만의 공간 ✦</div>
  <div id="icons"></div>
</div>
<p id="status">원하는 스타일로 꾸며 봐!</p>
</div>

<div class="panel">
<h2>① 아이콘 꾸미기</h2>
<label>앱 이름</label>
<input id="appname" type="text" value="나의 앱" maxlength="30">

<label>아이콘 사진</label>
<input id="iconfile" type="file" accept="image/*">

<label>아이콘 모양</label>
<select id="shape">
<option value="round">둥근 사각형</option>
<option value="circle">원형</option>
<option value="square">각진 사각형</option>
</select>

<label>아이콘 배경색</label>
<input id="iconcolor" type="color" value="#c6b4ff">

<button id="add">미리 보기에 아이콘 추가</button>
<button id="save">아이콘 PNG 저장</button>
</div>

<div class="panel">
<h2>② 배경화면 꾸미기</h2>
<label>배경화면 사진 선택</label>
<input id="wallfile" type="file" accept="image/*">
<button id="wallreset">기본 배경으로 되돌리기</button>
</div>

<div class="panel">
<h2>③ 위젯 꾸미기</h2>
<label>위젯 문구</label>
<input id="widgettext" type="text" value="✦ 나만의 공간 ✦">
<label>위젯 글자색</label>
<input id="widgetcolor" type="color" value="#ffffff">
<button id="widgettoggle">위젯 표시 / 숨기기</button>
</div>

<script>
const $ = id => document.getElementById(id);
let iconURL = "";
let hidden = false;
let customApps = [];

function readImage(file, callback) {
  if (!file) return;
  if (!file.type.startsWith("image/")) {
    alert("이미지 파일을 선택해 줘.");
    return;
  }
  const reader = new FileReader();
  reader.onload = () => callback(reader.result);
  reader.readAsDataURL(file);
}

function applyShape(img) {
  img.className = $("shape").value;
}

function renderIcons() {
  $("icons").innerHTML = "";
  customApps.forEach(app => {
    const item = document.createElement("div");
    item.className = "app";
    const img = document.createElement("img");
    img.src = app.image || "";
    img.style.background = app.color;
    applyShape(img);
    const name = document.createElement("div");
    name.textContent = app.name;
    item.append(img, name);
    $("icons").appendChild(item);
  });
}

$("iconfile").addEventListener("change", e => {
  readImage(e.target.files[0], url => {
    iconURL = url;
    $("status").textContent = "아이콘 사진을 선택했어.";
  });
});

$("add").onclick = () => {
  customApps.push({
    name: $("appname").value.trim() || "나의 앱",
    image: iconURL,
    color: $("iconcolor").value
  });
  renderIcons();
  $("status").textContent = "미리 보기에 아이콘을 추가했어.";
};

$("shape").onchange = renderIcons;
$("iconcolor").oninput = () => {
  customApps = customApps.map(app => ({
    ...app, color: $("iconcolor").value
  }));
  renderIcons();
};

$("wallfile").addEventListener("change", e => {
  readImage(e.target.files[0], url => {
    $("screen").style.backgroundImage = `url("${url}")`;
    $("status").textContent = "배경 미리 보기를 변경했어.";
  });
});

$("wallreset").onclick = () => {
  $("screen").style.backgroundImage =
    "linear-gradient(145deg,#b5a2e8,#f3cbd9)";
};

$("widgettext").oninput = () => {
  $("widget").textContent = $("widgettext").value;
};
$("widgetcolor").oninput = () => {
  $("widget").style.color = $("widgetcolor").value;
};
$("widgettoggle").onclick = () => {
  hidden = !hidden;
  $("widget").style.display = hidden ? "none" : "block";
};

function updateClock() {
  const now = new Date();
  $("clock").textContent =
    now.toLocaleTimeString("ko-KR", {
      hour:"2-digit", minute:"2-digit", hour12:false
    });
  $("date").textContent =
    now.toLocaleDateString("ko-KR", {
      month:"long", day:"numeric", weekday:"long"
    });
}
updateClock();
setInterval(updateClock, 30000);

$("save").onclick = () => {
  const canvas = document.createElement("canvas");
  canvas.width = 512;
  canvas.height = 512;
  const ctx = canvas.getContext("2d");
  const app = customApps[customApps.length - 1];
  if (!app) {
    alert("먼저 아이콘을 추가해 줘.");
    return;
  }
  ctx.fillStyle = app.color;
  ctx.fillRect(0, 0, 512, 512);

  function drawImage(img) {
    ctx.save();
    ctx.beginPath();
    const shape = $("shape").value;
    if (shape === "circle") {
      ctx.arc(256,256,256,0,Math.PI*2);
    } else if (shape === "round") {
      ctx.roundRect(0,0,512,512,95);
    } else {
      ctx.rect(0,0,512,512);
    }
    ctx.clip();
    ctx.drawImage(img,0,0,512,512);
    ctx.restore();
    download();
  }
  function download() {
    const a = document.createElement("a");
    a.download = "mytheme-icon.png";
    a.href = canvas.toDataURL("image/png");
    a.click();
  }
  if (app.image) {
    const img = new Image();
    img.onload = () => drawImage(img);
    img.onerror = () => alert("이미지를 불러오지 못했어.");
    img.src = app.image;
  } else {
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 52px sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(app.name.slice(0,8),256,256);
    download();
  }
};
</script>
</body>
</html>
