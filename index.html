
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#171522">
<title>MyTheme | 나만의 홈 꾸미기</title>

<style>
:root {
  --bg: #171522;
  --panel: #252235;
  --accent: #c7a9ff;
  --text: #ffffff;
  --muted: #bcb5ce;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 18px;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, sans-serif;
}

h1 { margin-bottom: 4px; }
h2 { font-size: 18px; }

.subtitle {
  color: var(--muted);
  margin-top: 0;
}

.panel {
  background: var(--panel);
  border-radius: 20px;
  padding: 16px;
  margin: 16px 0;
}

label {
  display: block;
  margin: 14px 0 7px;
  font-size: 14px;
}

input, select, button {
  width: 100%;
  padding: 12px;
  border: 0;
  border-radius: 11px;
  font: inherit;
}

input[type="text"], select {
  background: #39334d;
  color: white;
}

input[type="color"] {
  height: 48px;
  background: transparent;
  padding: 4px;
}

input[type="file"] {
  background: #39334d;
  color: white;
  font-size: 13px;
}

button {
  background: var(--accent);
  color: #211832;
  font-weight: 700;
  margin-top: 10px;
  cursor: pointer;
}

button.secondary {
  background: #39334d;
  color: white;
}

#screen {
  min-height: 470px;
  border-radius: 24px;
  padding: 30px 14px;
  background: linear-gradient(145deg, #8875c8, #e7aecb);
  background-size: cover;
  background-position: center;
  text-align: center;
  overflow: hidden;
}

#clock {
  font-size: 48px;
  font-weight: 300;
}

#date {
  font-size: 14px;
  margin-bottom: 28px;
}

#widget {
  display: inline-block;
  padding: 13px 18px;
  border-radius: 16px;
  background: #ffffff30;
  backdrop-filter: blur(8px);
  margin-bottom: 18px;
  max-width: 100%;
  overflow-wrap: anywhere;
}

#icons {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 22px 8px;
  margin-top: 18px;
}

.app {
  min-width: 0;
  font-size: 12px;
  overflow-wrap: anywhere;
}

.app img, .placeholder {
  width: 62px;
  height: 62px;
  max-width: 100%;
  margin: 0 auto 7px;
  display: flex;
  align-items: center;
  justify-content: center;
  object-fit: cover;
  color: white;
  font-size: 24px;
  overflow: hidden;
}

.circle { border-radius: 50%; }
.round { border-radius: 19px; }
.square { border-radius: 3px; }

.delete {
  display: block;
  padding: 4px;
  margin: 6px auto 0;
  width: auto;
  font-size: 11px;
  background: #51435e;
  color: white;
}

.note {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.6;
}

footer {
  color: var(--muted);
  font-size: 12px;
  text-align: center;
  padding: 12px;
}
</style>
</head>

<body>
<header>
  <h1>✦ MyTheme</h1>
  <p class="subtitle">나만의 홈 화면 디자인 스튜디오</p>
</header>

<section class="panel">
  <h2>미리 보기</h2>

  <div id="screen">
    <div id="clock">12:00</div>
    <div id="date"></div>
    <div id="widget">✦ 나만의 공간 ✦</div>
    <div id="icons"></div>
  </div>

  <p class="note">
    이 화면은 홈 화면 꾸미기 미리 보기야.
    실제 휴대폰 홈 화면과는 별도로 작동해.
  </p>
</section>

<section class="panel">
  <h2>① 아이콘 만들기</h2>

  <label for="appname">앱 이름</label>
  <input id="appname" type="text"
         maxlength="30" placeholder="앱 이름 입력">

  <label for="iconfile">아이콘 사진</label>
  <input id="iconfile" type="file" accept="image/*">

  <label for="shape">아이콘 모양</label>
  <select id="shape">
    <option value="round">둥근 사각형</option>
    <option value="circle">원형</option>
    <option value="square">각진 사각형</option>
  </select>

  <label for="iconcolor">아이콘 배경색</label>
  <input id="iconcolor" type="color" value="#a88bff">

  <button id="add">＋ 아이콘 추가</button>
  <button id="save" class="secondary">현재 아이콘 PNG 저장</button>

  <p class="note">
    사진을 선택하지 않아도 색상 아이콘을 만들 수 있어.
  </p>
</section>

<section class="panel">
  <h2>② 배경화면 설정</h2>

  <label for="wallfile">배경화면 사진 선택</label>
  <input id="wallfile" type="file" accept="image/*">

  <button id="wallreset" class="secondary">
    기본 배경으로 되돌리기
  </button>
</section>

<section class="panel">
  <h2>③ 위젯 꾸미기</h2>

  <label for="widgettext">위젯 문구</label>
  <input id="widgettext" type="text"
         maxlength="100" value="✦ 나만의 공간 ✦">

  <label for="widgetcolor">글자색</label>
  <input id="widgetcolor" type="color" value="#ffffff">

  <button id="widgettoggle" class="secondary">
    위젯 표시 / 숨기기
  </button>
</section>

<footer>
  MyTheme · 나만의 디자인을 만들어 봐!
</footer>

<script>
const $ = id => document.getElementById(id);

let iconURL = "";
let apps = [];
let widgetHidden = false;

function readImage(file, callback) {
  if (!file) return;

  if (!file.type.startsWith("image/")) {
    alert("이미지 파일을 선택해 줘.");
    return;
  }

  const reader = new FileReader();

  reader.onload = () => callback(reader.result);
  reader.onerror = () => alert("이미지를 읽지 못했어.");

  reader.readAsDataURL(file);
}

function renderIcons() {
  const container = $("icons");
  container.replaceChildren();

  apps.forEach((app, index) => {
    const item = document.createElement("div");
    item.className = "app";

    let picture;

    if (app.image) {
      picture = document.createElement("img");
      picture.src = app.image;
      picture.alt = app.name;
    } else {
      picture = document.createElement("div");
      picture.className = "placeholder";
      picture.textContent = "✦";
    }

    picture.classList.add(app.shape);
    picture.style.backgroundColor = app.color;

    const name = document.createElement("div");
    name.textContent = app.name;

    const remove = document.createElement("button");
    remove.className = "delete";
    remove.textContent = "삭제";

    remove.onclick = () => {
      apps.splice(index, 1);
      renderIcons();
    };

    item.append(picture, name, remove);
    container.appendChild(item);
  });
}

$("iconfile").addEventListener("change", event => {
  readImage(event.target.files[0], url => {
    iconURL = url;
  });
});

$("add").onclick = () => {
  const name = $("appname").value.trim();

  if (!name) {
    alert("앱 이름을 입력해 줘.");
    return;
  }

  apps.push({
    name: name,
    image: iconURL,
    shape: $("shape").value,
    color: $("iconcolor").value
  });

  iconURL = "";
  $("iconfile").value = "";
  $("appname").value = "";

  renderIcons();
};

$("shape").onchange = () => {
  apps = apps.map(app => ({
    ...app,
    shape: $("shape").value
  }));
  renderIcons();
};

$("iconcolor").oninput = () => {
  apps = apps.map(app => ({
    ...app,
    color: $("iconcolor").value
  }));
  renderIcons();
};

$("wallfile").addEventListener("change", event => {
  readImage(event.target.files[0], url => {
    $("screen").style.backgroundImage =
      'url("' + url + '")';
  });
});

$("wallreset").onclick = () => {
  $("screen").style.backgroundImage =
    "linear-gradient(145deg,#8875c8,#e7aecb)";
  $("wallfile").value = "";
};

$("widgettext").oninput = () => {
  $("widget").textContent = $("widgettext").value;
};

$("widgetcolor").oninput = () => {
  $("widget").style.color = $("widgetcolor").value;
};

$("widgettoggle").onclick = () => {
  widgetHidden = !widgetHidden;
  $("widget").style.display =
    widgetHidden ? "none" : "inline-block";
};

function updateClock() {
  const now = new Date();

  $("clock").textContent =
    now.toLocaleTimeString("ko-KR", {
      hour: "2-digit",
      minute: "2-digit",
      hour12: false
    });

  $("date").textContent =
    now.toLocaleDateString("ko-KR", {
      month: "long",
      day: "numeric",
      weekday: "long"
    });
}

updateClock();
setInterval(updateClock, 30000);

$("save").onclick = () => {
  const app = apps[apps.length - 1];

  if (!app) {
    alert("먼저 아이콘을 추가해 줘.");
    return;
  }

  const canvas = document.createElement("canvas");
  canvas.width = 512;
  canvas.height = 512;

  const ctx = canvas.getContext("2d");

  ctx.fillStyle = app.color;
  ctx.fillRect(0, 0, 512, 512);

  function drawIcon(img) {
    ctx.save();
    ctx.beginPath();

    if (app.shape === "circle") {
      ctx.arc(256, 256, 256, 0, Math.PI * 2);
    } else if (app.shape === "round") {
      ctx.roundRect(0, 0, 512, 512, 85);
    } else {
      ctx.rect(0, 0, 512, 512);
    }

    ctx.clip();

    if (img) {
      ctx.drawImage(img, 0, 0, 512, 512);
    } else {
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 160px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("✦", 256, 256);
    }

    ctx.restore();

    const link = document.createElement("a");
    link.download = "mytheme-icon.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
  }

  if (app.image) {
    const img = new Image();

    img.onload = () => drawIcon(img);
    img.onerror = () => alert("아이콘 이미지를 불러오지 못했어.");
    img.src = app.image;
  } else {
    drawIcon(null);
  }
};
</script>
</body>
</html>
